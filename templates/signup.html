{% extends "base.html" %}

{% block title %}Sign Up | Tring{% endblock %}

{% block content %}
<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">
                <i data-lucide="user-plus"></i>
            </div>
            <h1>Create an account</h1>
            <p class="auth-subtitle">Join the SolveHub community</p>
        </div>

        <!-- {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <i data-lucide="{{ 'alert-circle' if category == 'error' else 'check-circle' }}"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %} -->

        <form method="POST" class="auth-form">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Enter password..." 
                        required
                    >
                    <button 
                        type="button" 
                        class="toggle-password-btn" 
                        onclick="togglePasswordVisibility('password', this)"
                        tabindex="-1"
                        title="Hide/Show Password"
                    >
                        <i data-lucide="eye" class="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">Sign Up</button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Log In</a>
        </p>

    </div>

</div>

<script>
function togglePasswordVisibility(inputId, btn) {
    const passwordInput = document.getElementById(inputId);
    const icon = btn.querySelector("[data-lucide]");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        
        if (icon) {
            icon.setAttribute("data-lucide", "eye-off");
        }
    } else {
        passwordInput.type = "password";
        
        if (icon) {
            icon.setAttribute("data-lucide", "eye");
        }
    }

    if (typeof lucide !== "undefined") {
        lucide.createIcons();
    }
}
</script>

{% endblock %}
