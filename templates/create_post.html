{% extends "base.html" %}

{% block title %}Buat Post | Tring{% endblock %}

{% block content %}
<div class="auth-container">
    
    <div class="auth-card" style="max-width: 600px;">
        <div class="auth-header">
            <h1>Buat Post</h1>
        </div>

        <form action="{{ url_for('posts.create_post') }}" method="POST" enctype="multipart/form-data" class="auth-form">
            <div class="form-group">
                <label for="category_id">Kategori</label>
                <select id="category_id" name="category_id" required style="width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: var(--radius-md);">
                    <option value="" disabled selected>Pilih Kategori</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="title">Judul</label>
                <input type="text" id="title" name="title" placeholder="Title" required>
            </div>

            <div class="form-group">
                <label for="content">Konten</label>
                <textarea id="content" name="content" rows="6" placeholder="Text" style="background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px; border-radius: var(--radius-md); font-family: inherit;" required></textarea>
            </div>

            <div class="form-group">
                <label>Tambahkan Lampiran (Gambar, Video, Audio - 4 File Maximal)</label>
                <input 
                    type="file" 
                    name="media" 
                    id="media"
                    accept="image/*,video/*,audio/*"
                    multiple 
                    class="media-file-input"
                >
                <small style="color: var(--text-secondary); display: block; margin-top: 4px;">
                    Format yang valid: PNG, JPG, MP4, WEBM, MP3, WAV
                </small>
            </div>

            <button type="submit" class="btn-primary">Post</button>
        </form>
    </div>

</div>
{% endblock %}
